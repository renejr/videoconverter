[tool:pytest]
# Configuração do pytest para testes do User Service

# Diretórios de teste
testpaths = .

# Padrões de arquivos de teste
python_files = test_*.py *_test.py

# Padrões de classes de teste
python_classes = Test*

# Padrões de funções de teste
python_functions = test_*

# Marcadores personalizados
markers =
    unit: marca testes unitários
    integration: marca testes de integração
    auth: marca testes relacionados à autenticação
    registration: marca testes de cadastro de usuário
    slow: marca testes que demoram para executar
    database: marca testes que usam banco de dados

# Opções padrão
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Configuração de cobertura
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuração para testes assíncronos
asyncio_mode = auto

# Timeout para testes (em segundos)
timeout = 300

# Configuração de logging durante testes
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S