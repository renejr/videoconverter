# VidConv - Nginx config para acesso via IP fixo
# Copie este arquivo para /etc/nginx/sites-available/vidconv
# Ative com: ln -s /etc/nginx/sites-available/vidconv /etc/nginx/sites-enabled/
# Teste: nginx -t && systemctl restart nginx

# Upstreams locais
upstream frontend {
    server 127.0.0.1:3000;
}

upstream user_service {
    server 127.0.0.1:8001;
}

upstream notification_service {
    server 127.0.0.1:8002;
}

# HTTP (sem domínio)
server {
    listen 80 default_server;
    server_name _;  # Qualquer host (IP)

    # Tamanho de upload e timeouts
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Alguns headers de segurança que funcionam em HTTP
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Frontend Next.js
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API de usuários
    location /api/users/ {
        proxy_pass http://user_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API de notificações
    location /api/notifications/ {
        proxy_pass http://notification_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Arquivos estáticos (uploads/downloads)
    location /uploads/ {
        alias /opt/vidconv/uploads/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /converted/ {
        alias /opt/vidconv/converted/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/vidconv_access.log;
    error_log /var/log/nginx/vidconv_error.log;
}

